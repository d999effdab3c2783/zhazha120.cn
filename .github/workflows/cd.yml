name: deploy

on:
    push:
    workflow_dispatch:

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4

            - run: npm install --global --ignore-scripts=false @nubjs/nub
            - run: nub install --frozen-lockfile

            - run: nub run format:check
            - run: nub run lint
    generate:
        runs-on: ubuntu-latest
        needs: quality

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4

            - run: npm install --global --ignore-scripts=false @nubjs/nub
            - run: nub install --frozen-lockfile

            - run: nub run generate

            - uses: FurCDN/github-action@v1
              with:
                  action: pages-deploy
                  api-key: ${{ secrets.FURCDN_API_KEY }}
                  branch: ${{ github.ref_name }}
                  dir: .output/public
                  site: zhazha120-cn